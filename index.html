<!DOCTYPE html>
<html lang="fr">

<head>
    <!-- meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titre et Icon (remplacés par BDD/json/global.json → site) -->
    <title>Portfolio</title>
    <link rel="icon" href="./asset/picture/icon-aseprite.png">

    <!-- StylesHeet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="asset/css/style.css">
    <link rel="stylesheet" href="asset/css/sections.css">
    <link rel="stylesheet" href="asset/css/responsive.css">
    <link rel="stylesheet" href="asset/css/navigation.css">
    <link rel="stylesheet" href="asset/css/footer.css">
    <link rel="stylesheet" href="asset/css/animation.css">
</head>

<!--
    TEMPLATE : Ce fichier ne contient que la structure de la page
-->

<body>
    <!-- navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fab fa-github"></i>
                <a href="#">Portfolio</a>
            </div>
            <div class="nav-menu" id="nav-menu">
                <!-- Généré depuis global.json => sections -->
            </div>
            <div class="nav-right">
                <div class="theme-selector">
                    <button class="theme-button" id="theme-button">
                        <i class="fas fa-sun theme-icon"></i>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="theme-dropdown" id="theme-dropdown">
                        <div class="theme-option" data-theme="light">
                            <i class="fas fa-sun"></i>
                            <span>Clair</span>
                        </div>
                        <div class="theme-option" data-theme="dark">
                            <i class="fas fa-moon"></i>
                            <span>Sombre</span>
                        </div>
                        <div class="theme-option" data-theme="system">
                            <i class="fas fa-desktop"></i>
                            <span>Système</span>
                        </div>
                    </div>
                </div>
                <div class="nav-toggle" id="nav-toggle">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- main -->
    <!-- Section Accueil -->
    <section class="hero" data-section="home">
        <!-- Fond animé -->
        <div class="hero-bg" aria-hidden="true"></div>
        <div class="hero-blur" aria-hidden="true"></div>
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title"></h1>
                <p class="hero-subtitle"></p>
                <div class="hero-stats">
                    <!-- Mis à jour automatiquement depuis GitHub (script.js) -->
                    <div class="stat-item">
                        <i class="fas fa-code"></i>
                        <span><span id="hero-repos">–</span> public repos</span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-fire"></i>
                        <span><span id="hero-contribs">–</span> contributions this year</span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-users"></i>
                        <span><span id="hero-followers">–</span> followers</span>
                    </div>
                </div>
                <div class="hero-buttons"></div>
            </div>
            <div class="hero-image">
                <div class="profile-card">
                    <div class="profile-avatar">
                        <img alt=""
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <!-- Fallback si l'image ne charge pas -->
                        <div class="profile-avatar-fallback" style="display: none;">
                            <i class="fas fa-user"></i>
                        </div>
                    </div>
                    <div class="profile-info">
                        <h3></h3>
                        <!-- Bio : global.json → owner.bio, remplacée par la bio GitHub si github.useGitHubBio -->
                        <p id="profile-bio"></p>
                        <div class="profile-stats"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Section À propos -->
    <section class="about" data-section="about">
        <div class="container">
            <div class="section-header"></div>
            <div class="about-content">
                <!-- Onglets : BDD/json/about.json -->
                <div class="about-tabs" role="tablist"></div>
                <div class="about-panels"></div>
            </div>
        </div>
    </section>

    <!-- Section Compétences -->
    <section class="skills" data-section="skills">
        <div class="container">
            <div class="section-header"></div>
            <div class="skills-grid"></div>
        </div>
    </section>

    <!-- Section Projets -->
    <section class="projects" data-section="projects">
        <div class="container">
            <div class="section-header"></div>
            <div class="project-groups"></div>
        </div>
    </section>

    <!-- Section Contact -->
    <section class="contact" data-section="contact">
        <div class="container">
            <div class="section-header"></div>
            <div class="contact-content">
                <div class="contact-info">
                    <div class="contact-card"></div>
                    <div class="social-links"></div>
                </div>
                <div class="contact-map">
                    <div class="map-responsive">
                        <iframe loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"
                            title="Map"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-center">
                    <p></p>
                </div>
            </div>
        </div>
    </footer>
 
    <template id="github-panel-template">
        <div class="gh-summary">
            <p><strong id="gh-total">…</strong> contributions in the last year</p>
            <a href="#" target="_blank" rel="noopener" class="gh-profile-link" id="gh-profile-link">
                <i class="fab fa-github"></i> <span id="gh-username"></span>
            </a>
        </div>

        <div class="contribution-graph">
            <div class="graph-container">
                <div class="graph-weeks" aria-label="GitHub contribution calendar"></div>
            </div>
            <div class="graph-legend">
                <span>Less</span>
                <div class="legend-squares">
                    <div class="square level-0"></div>
                    <div class="square level-1"></div>
                    <div class="square level-2"></div>
                    <div class="square level-3"></div>
                    <div class="square level-4"></div>
                </div>
                <span>More</span>
            </div>
        </div>

        <div class="gh-stats">
            <div class="gh-stat"><span id="gh-streak">–</span><small>Current streak</small></div>
            <div class="gh-stat"><span id="gh-longest">–</span><small>Longest streak</small></div>
            <div class="gh-stat"><span id="gh-best">–</span><small id="gh-best-label">Best day</small></div>
            <div class="gh-stat"><span id="gh-active">–</span><small>Active days</small></div>
            <div class="gh-stat"><span id="gh-repos">–</span><small>Public repos</small></div>
            <div class="gh-stat"><span id="gh-followers">–</span><small>Followers</small></div>
            <div class="gh-stat"><span id="gh-following">–</span><small>Following</small></div>
            <div class="gh-stat"><span id="gh-since">–</span><small>On GitHub since</small></div>
        </div>

        <h4 class="gh-heading">Top languages</h4>
        <div class="gh-lang-bar" id="gh-lang-bar"></div>
        <ul class="gh-lang-list" id="gh-lang-list"></ul>

        <h4 class="gh-heading">Recently active repositories</h4>
        <ul class="gh-repos" id="gh-recent-repos">
            <li class="gh-loading">Loading…</li>
        </ul>
    </template>

    <!-- Scripts -->
    <script src="asset/script/render.js"></script>
    <script src="asset/script/script.js"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</body>

</html>
